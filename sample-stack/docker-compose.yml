# ChaosPilot sample stack
#
# Topology:
#   gateway -> auth, orders
#   auth -> cache
#   orders -> payments, db
#   payments -> db
#
# Configuration comes from the repository-root .env (optional) and non-secret
# ${VAR} defaults. No literal credentials are defined here.

name: ${COMPOSE_PROJECT_NAME:-chaospilot}

x-service-common: &service-common
  env_file:
    - path: ../.env
      required: false
  restart: unless-stopped
  networks:
    - chaospilot
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile

services:
  gateway:
    <<: *service-common
    build:
      <<: *service-build
      args:
        SERVICE_NAME: gateway
    container_name: chaospilot-gateway
    depends_on:
      auth:
        condition: service_healthy
      orders:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: gateway
      RESILIENT: ${RESILIENT:-false}
      LOG_LEVEL: ${SAMPLE_STACK_LOG_LEVEL:-info}
      AUTH_URL: http://auth:8000
      ORDERS_URL: http://orders:8000

  auth:
    <<: *service-common
    build:
      <<: *service-build
      args:
        SERVICE_NAME: auth
    container_name: chaospilot-auth
    depends_on:
      cache:
        condition: service_healthy
    ports:
      - "${AUTH_PORT:-8001}:8000"
    environment:
      SERVICE_NAME: auth
      RESILIENT: ${RESILIENT:-false}
      LOG_LEVEL: ${SAMPLE_STACK_LOG_LEVEL:-info}
      CACHE_URL: http://cache:8000

  orders:
    <<: *service-common
    build:
      <<: *service-build
      args:
        SERVICE_NAME: orders
    container_name: chaospilot-orders
    depends_on:
      payments:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "${ORDERS_PORT:-8002}:8000"
    environment:
      SERVICE_NAME: orders
      RESILIENT: ${RESILIENT:-false}
      LOG_LEVEL: ${SAMPLE_STACK_LOG_LEVEL:-info}
      PAYMENTS_URL: http://payments:8000
      DB_URL: http://db:8000

  cache:
    <<: *service-common
    build:
      <<: *service-build
      args:
        SERVICE_NAME: cache
    container_name: chaospilot-cache
    ports:
      - "${CACHE_PORT:-8003}:8000"
    environment:
      SERVICE_NAME: cache
      RESILIENT: ${RESILIENT:-false}
      LOG_LEVEL: ${SAMPLE_STACK_LOG_LEVEL:-info}

  payments:
    <<: *service-common
    build:
      <<: *service-build
      args:
        SERVICE_NAME: payments
    container_name: chaospilot-payments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PAYMENTS_PORT:-8004}:8000"
    environment:
      SERVICE_NAME: payments
      RESILIENT: ${RESILIENT:-false}
      LOG_LEVEL: ${SAMPLE_STACK_LOG_LEVEL:-info}
      DB_URL: http://db:8000

  db:
    <<: *service-common
    build:
      <<: *service-build
      args:
        SERVICE_NAME: db
    container_name: chaospilot-db
    ports:
      - "${DB_PORT:-8005}:8000"
    environment:
      SERVICE_NAME: db
      RESILIENT: ${RESILIENT:-false}
      LOG_LEVEL: ${SAMPLE_STACK_LOG_LEVEL:-info}

networks:
  chaospilot:
    name: ${CHAOSPILOT_DOCKER_NETWORK:-chaospilot}
    driver: bridge
